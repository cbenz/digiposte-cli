# digiposte-cli configuration
# Generated automatically on first run. Every key is OPTIONAL:
# uncomment a line (and set a value) to override the built-in default.

[auth]
# SSO login URL
# login_url = "https://secure.digiposte.fr/home"

# Automatic credentials pre-fill in the browser. Leave commented for a fully
# manual login.
# The password may be produced by ANY shell command on your machine, using the
# "command:" prefix, e.g.:
#   password = "command:pass show digiposte"
#   password = "command:echo -n mypassword"
# Uncomment and replace the "changeme" placeholders with your credentials:
# email = "changeme"
# password = "changeme"

# Run the browser without a window (needs an already authenticated profile;
# a CAPTCHA cannot be solved headless).
# headless = false

# Anti-CAPTCHA login: digiposte-cli launches its own dedicated Chrome (own
# --user-data-dir under the state dir, DevTools port 9222) and attaches to it
# over CDP. The Playwright profile is flagged by La Poste's anti-bot (blank
# CAPTCHA); a real, human-operated Chrome is not, so the CAPTCHA is solvable
# and the session is reused silently on later runs.
# ENABLED BY DEFAULT — set to false to use the legacy Playwright profile.
# use_running_chrome = false

[playwright]
# Browser channel. "chrome" = installed Google Chrome (default),
# "msedge" = Edge, "" or "chromium" = Playwright bundled Chromium.
# channel = "chrome"

[api]
# Base URL of the personal vault API
# base_url = "https://api.digiposte.fr/api/v3"
# Locations to browse: SAFE = safe box, INBOX = inbox
# (uppercase = API identifiers; the listing URLs use their lowercase form)
# locations = ["SAFE", "INBOX"]
# Maximum number of documents requested per call
# max_results = 1000

[download]
# Rename downloaded files with regular expressions, applied to each file
# *stem* (the extension is kept) in the order listed. Unlike ameli-cli, the
# file names come from the vault content (Digiposte does not dictate them),
# so the rules are yours to express: match/replace pairs using Python `re`
# syntax (back-references \1, \g<name>, …).
#
# Example — a file whose whole name is "BULLETIN DE PAIE 02_2026.pdf"
# (month first, ALL CAPS from the sender). Rename it to a normal, readable
# name that sorts chronologically — "Bulletin de paie 2026-02.pdf" — by
# spelling the complete name in both the pattern and the replacement:
#   rename_rules = [
#     { pattern = '(?i)^BULLETIN DE PAIE (0[1-9]|1[0-2])_([0-9]{4})$', replacement = 'Bulletin de paie \2-\1' },
#   ]
# A shorter rule only reorders a trailing "MM_YYYY" date token (the prefix
# the vault gave is kept as-is, e.g. "BULLETIN DE PAIE 2026-02"):
#   rename_rules = [
#     { pattern = '(0[1-9]|1[0-2])_([0-9]{4})$', replacement = '\2-\1' },
#   ]
# Note: each rule is an inline table and must stay on a single line. Prefer
# single-quoted strings: in double-quoted TOML strings a backslash must be
# escaped ("\\d", "\\1"). Files downloaded before these rules existed are
# renamed automatically on the next `sync` (not downloaded again).
# rename_rules = []

[log]
# Logging level: DEBUG, INFO, WARNING, ERROR
# level = "INFO"

[paths]
# Documents destination directory (default: ~/Documents/digiposte)
# download_dir = "~/Documents/digiposte"
# Persistent browser profile (default: ~/.local/share/digiposte-cli/chrome-profile)
# profile_dir = "~/.local/share/digiposte-cli/chrome-profile"
# API token cache, valid ~1 h (default: ~/.local/state/digiposte-cli/token.json)
# token_cache = "~/.local/state/digiposte-cli/token.json"
# Dedicated Chrome profile used by use_running_chrome
# (default: ~/.local/state/digiposte-cli/chrome-debug)
# debug_profile_dir = "~/.local/state/digiposte-cli/chrome-debug"
